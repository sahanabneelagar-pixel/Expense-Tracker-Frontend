<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Expense Tracker</h1>
    <p>Record and manage your daily expenses</p>
</header>

<main>
    <section class="summary">
        <div>
            <h3>Total Expense</h3>
            <p id="total">₹0.00</p>
        </div>
        <div>
            <h3>Total Records</h3>
            <p id="count">0</p>
        </div>
    </section>

    <section class="form-section">
        <h2>Add Expense</h2>

        <form id="expenseForm">
            <div>
                <label for="name">Expense Name</label>
                <input type="text" id="name" placeholder="Enter expense" required>
            </div>

            <div>
                <label for="amount">Amount</label>
                <input type="number" id="amount" min="1" step="0.01"
                       placeholder="Enter amount" required>
            </div>

            <div>
                <label for="category">Category</label>
                <select id="category" required>
                    <option value="">Select Category</option>
                    <option>Food</option>
                    <option>Travel</option>
                    <option>Shopping</option>
                    <option>Bills</option>
                    <option>Education</option>
                    <option>Entertainment</option>
                    <option>Health</option>
                    <option>Other</option>
                </select>
            </div>

            <div>
                <label for="date">Date</label>
                <input type="date" id="date" required>
            </div>

            <button type="submit" id="submitBtn">Add Expense</button>
            <button type="button" id="cancelBtn" class="cancel">Cancel</button>
        </form>

        <p id="message"></p>
    </section>

    <section class="filter-section">
        <div>
            <label for="search">Search</label>
            <input type="search" id="search" placeholder="Search expense...">
        </div>

        <div>
            <label for="filter">Filter Category</label>
            <select id="filter">
                <option>All</option>
                <option>Food</option>
                <option>Travel</option>
                <option>Shopping</option>
                <option>Bills</option>
                <option>Education</option>
                <option>Entertainment</option>
                <option>Health</option>
                <option>Other</option>
            </select>
        </div>
    </section>

    <section class="list-section">
        <h2>Expense List</h2>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Expense</th>
                        <th>Category</th>
                        <th>Amount</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="expenseList"></tbody>
            </table>
        </div>

        <p id="empty">No expenses found.</p>
    </section>
</main>

<footer>
    <p>Expense Tracker © 2026</p>
</footer>

<script src="script.js"></script>
</body>
</html>
