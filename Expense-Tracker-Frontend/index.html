<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Expense Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Expense Tracker</h1><p>Manage Your Expenses</p></header>
<main>
<section class="form">
<h2>Add Expense</h2>
<form id="expenseForm">
<label>Expense Name</label><input id="name" required>
<label>Amount</label><input id="amount" type="number" min="1" required>
<label>Category</label>
<select id="category" required>
<option value="">Select Category</option><option>Food</option>
<option>Travel</option><option>Shopping</option><option>Bills</option>
<option>Education</option><option>Other</option></select>
<label>Date</label><input id="date" type="date" required>
<button>Add Expense</button>
</form>
</section>
<section class="tools">
<input id="search" placeholder="Search expense">
<select id="filter"><option>All</option><option>Food</option><option>Travel</option>
<option>Shopping</option><option>Bills</option><option>Education</option><option>Other</option></select>
</section>
<h2>Total: ₹<span id="total">0</span></h2>
<section class="list"><h2>Expense List</h2><div id="items"></div></section>
</main>
<script src="script.js"></script>
</body>
</html>
